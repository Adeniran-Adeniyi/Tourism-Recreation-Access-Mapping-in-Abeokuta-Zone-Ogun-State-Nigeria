
[project]
name = "tourism-rec"
version = "0.1.0"
description = "Tourism and Recreation Accessibility Mapping"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "rasterio>=1.5.2",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
